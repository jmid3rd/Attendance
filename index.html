<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMG ATTENDANCE</title>
<style>
body{background:#1c1c1e;color:#fff;font-family:Arial;padding:10px;margin:0}
h2{text-align:center;color:#0a84ff;font-size:16px}
.box{background:#2c2c2e;border-radius:12px;padding:10px;margin:8px 0}
.chip{display:inline-block;padding:8px 12px;margin:4px;border-radius:20px;background:#3a3a3c;border:1px solid #555;font-size:13px;cursor:pointer}
.chip.present{background:#0a84ff;color:#fff;font-weight:bold}
.chip.dayoff{background:#ff9f0a;color:#000;font-weight:bold}
.chip.absent{background:#ff3b30;color:#fff}
.chip.onleave{background:#bf5af2;color:#fff}
.chip.seminar{background:#64d2ff;color:#000}
.chip.offset{background:#8e8e93;color:#fff}
.chip.holiday{background:#30d158;color:#000}
.total{padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin-top:8px}
.total.ok{background:#30d158;color:#000} .total.warn{background:#ff3b30;color:#fff}
.mbox{background:#252528;border:1px solid #ffcc02;border-radius:10px;padding:10px;margin:8px 0;position:relative}
.mbox select{width:100%;padding:9px;margin:4px 0;border-radius:8px;background:#111;color:#fff;border:1px solid #555}
.del{position:absolute;top:5px;right:5px;background:#ff3b30;color:#fff;border:none;border-radius:50%;width:22px;height:22px}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:8px;font-weight:bold}
.add{background:#30d158;color:#fff} .gen{background:#0a84ff;color:#fff} .copy{background:#ffcc02;color:#000;display:none}
pre{background:#000;color:#fff;padding:12px;white-space:pre-wrap;display:none;font-size:12px}
input{width:100%;padding:10px;border-radius:8px;background:#222;color:#fff;border:1px solid #555;box-sizing:border-box}
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:999;justify-content:center;align-items:center}
.popup.show{display:flex}
.popup-box{background:#2c2c2e;border-radius:16px;padding:16px;width:88%;max-width:320px;border:2px solid #0a84ff}
.opt{width:100%;padding:12px;margin:4px 0;border:none;border-radius:10px;font-weight:bold;font-size:14px}
.opt.present{background:#0a84ff;color:#fff} .opt.dayoff{background:#ff9f0a;color:#000}
.opt.absent{background:#ff3b30;color:#fff} .opt.onleave{background:#bf5af2;color:#fff}
.opt.seminar{background:#64d2ff;color:#000} .opt.offset{background:#8e8e93;color:#fff}
.opt.holiday{background:#30d158;color:#000} .close{background:#3a3a3c;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.c{background:#1c1c1e;padding:7px;border-radius:6px;text-align:center;font-size:12px;border:1px solid #444}
.label{font-size:11px;color:#ffcc02;margin:6px 0 2px 2px}
</style>
</head>
<body>
<h2>📋 TMG - 13 PERSONNEL </h2>
<input id="date" value="NOV. 19, 2026">

<div class="box">
<b>1. PRESENT - click name</b>
<div id="chips" style="margin-top:8px"></div>
<div class="total ok" id="bar">Loading...</div>
<div class="grid"><div class="c">DAY OFF: <b id="cD">0</b></div><div class="c">ABSENT: <b id="cA">0</b></div><div class="c">ONLEAVE: <b id="cL">0</b></div><div class="c">SEMINAR: <b id="cS">0</b></div><div class="c">OFFSET: <b id="cO">0</b></div><div class="c">HOLIDAY: <b id="cH">0</b></div></div>
</div>

<div class="box">
<b>2. DISPATCH - 3 tao per mobile</b>
<div id="container"></div>
<button class="add" onclick="addMobile()">+ ADD MOBILE</button>
</div>

<div class="box">
<b>3. RADIO & SUPERVISOR</b>
<div class="label">RADIO OPERATOR (1 tao lang)</div>
<select id="radio" class="final" onchange="enforce()"></select>
<div class="label">SUPERVISOR (1 o 2 tao)</div>
<select id="supa" class="final" onchange="enforce()"></select>
<select id="supb" class="final" onchange="enforce()" style="margin-top:6px"></select>
</div>

<button class="gen" onclick="gen()">Generate Report</button>
<button class="copy" id="copyBtn" onclick="copyR()">📋 Copy Report</button>
<pre id="out"></pre>

<div class="popup" id="popup" onclick="if(event.target===this) closePop()">
<div class="popup-box">
<h3 id="popName" style="text-align:center">NAME</h3>
<button class="opt present" onclick="setStat('PRESENT')">✅ PRESENT</button>
<button class="opt dayoff" onclick="setStat('DAY OFF')">🌴 DAY OFF</button>
<button class="opt absent" onclick="setStat('ABSENT')">❌ ABSENT</button>
<button class="opt onleave" onclick="setStat('ONLEAVE')">📝 ONLEAVE</button>
<button class="opt seminar" onclick="setStat('SEMINAR')">📚 SEMINAR</button>
<button class="opt offset" onclick="setStat('OFFSET')">↩️ OFFSET</button>
<button class="opt holiday" onclick="setStat('HOLIDAY')">🎉 HOLIDAY</button>
<button class="opt close" onclick="closePop()">Cancel</button>
</div>
</div>

<script>
const all=["BAYAUA","RAMOS","DOMAGTOY","DUMPIT","ROMEN","LAZARO","IGNALIG","CUARTEROS","BUENO","CONTAWE","CARBONEL","PALAD","NATADA"];
const mobiles=["MOBILE 01","MOBILE 05","MOBILE 06","MOBILE 07","SBY MOBILE","MOBILE 02","MOBILE PATROL"];
const aors=["BALINTAWAK S/B","BALINTAWAK N/B","COMMO- ELLIPTICAL","MEGA MALL N/B","WELCOME ROTUNDA ARANETA QUEZON AVENUE","BASE ON CALL","EDSA - CUBAO","EDSA - ORTIGAS"];
let data={}; all.forEach(n=>data[n]="PRESENT"); let currentName=null;

function renderChips(){
 const div=document.getElementById('chips'); div.innerHTML='';
 let cnt={PRESENT:0,"DAY OFF":0,ABSENT:0,ONLEAVE:0,SEMINAR:0,OFFSET:0,HOLIDAY:0};
 for(let name of all){ cnt[data[name]]++; }
 all.forEach(name=>{
  const chip=document.createElement('span'); const st=data[name];
  let cls='chip '+ (st==='PRESENT'?'present':st==='DAY OFF'?'dayoff':st==='ABSENT'?'absent':st==='ONLEAVE'?'onleave':st==='SEMINAR'?'seminar':st==='OFFSET'?'offset':'holiday');
  chip.className=cls; chip.innerText=name; chip.onclick=()=>openPop(name); div.appendChild(chip);
 });
 document.getElementById('cD').innerText=cnt['DAY OFF']; document.getElementById('cA').innerText=cnt['ABSENT']; document.getElementById('cL').innerText=cnt['ONLEAVE'];
 document.getElementById('cS').innerText=cnt['SEMINAR']; document.getElementById('cO').innerText=cnt['OFFSET']; document.getElementById('cH').innerText=cnt['HOLIDAY'];
 document.getElementById('bar').innerText=`PRESENT: ${cnt['PRESENT']} / 13 | TOTAL 13 ✅  DAY OFF:${cnt['DAY OFF']} ABSENT:${cnt['ABSENT']} ONLEAVE:${cnt['ONLEAVE']}`;
}
function openPop(name){ currentName=name; document.getElementById('popName').innerText=name+" ("+data[name]+")"; document.getElementById('popup').classList.add('show'); }
function closePop(){ document.getElementById('popup').classList.remove('show'); currentName=null; }
function setStat(stat){ if(currentName){ data[currentName]=stat; renderChips(); refreshDispatch(); closePop(); } }
function getPresent(){ return all.filter(k=>data[k]==='PRESENT'); }
function getAllSelects(){ return [...document.querySelectorAll('.mbox .person'), ...document.querySelectorAll('.final')]; }
function enforce(){ const selects=getAllSelects(); let seen=new Set(); selects.forEach(s=>{ if(s.value){ if(seen.has(s.value)){ s.value=''; } else { seen.add(s.value); } } }); refreshDispatch(); }
function refreshDispatch(){
 const present=getPresent(); const selects=getAllSelects(); let used=[]; selects.forEach(s=>{ if(s.value) used.push(s.value); });
 selects.forEach(sel=>{ const keep=sel.value; sel.innerHTML='<option value="">-- PILI TAO --</option>'; present.forEach(p=>{ if(!used.includes(p) || p===keep){ const o=document.createElement('option'); o.value=p; o.text=p; if(p===keep) o.selected=true; sel.appendChild(o); } }); });
}
function addMobile(m='',a=''){
 const div=document.createElement('div'); div.className='mbox';
 div.innerHTML=`<button class="del" onclick="this.parentElement.remove();enforce()">x</button>
 <select class="mobile"><option value="">-- PILI MOBILE --</option>${mobiles.map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select>
 <select class="aor"><option value="">-- PILI AOR --</option>${aors.map(x=>`<option ${x===a?'selected':''}>${x}</option>`).join('')}</select>
 <select class="person p1" onchange="enforce()"></select>
 <select class="person p2" onchange="enforce()"></select>
 <select class="person p3" onchange="enforce()"></select>
 <button onclick="addPerson(this)" style="background:#3a3a3c;color:#ffcc02;padding:6px;font-size:11px">+ ADD 4th PERSON kung kailangan</button>`;
 document.getElementById('container').appendChild(div); refreshDispatch();
}
function addPerson(btn){
 const mbox=btn.parentElement; const sel=document.createElement('select');
 sel.className='person p4'; sel.onchange=()=>enforce(); sel.style.cssText='width:100%;padding:9px;margin:4px 0;border-radius:8px;background:#111;color:#fff;border:1px solid #555';
 mbox.insertBefore(sel, btn); refreshDispatch();
}
function gen(){
 let cnt={PRESENT:0,"DAY OFF":0,ABSENT:0,ONLEAVE:0,SEMINAR:0,OFFSET:0,HOLIDAY:0}; for(let v of Object.values(data)){ cnt[v]++; }
 let r=`DAILY ATTENDANCE/ MOBILE DISPATCH\nDATE: ${document.getElementById('date').value}\nSHIFT:3RD SHIFT 9:00PM-5:00AM\nATTENDANCE\nPRESENT ${cnt['PRESENT']}\nDAY OFF. ${cnt['DAY OFF']}\nABSENT. ${cnt['ABSENT']}\nONLEAVE. ${cnt['ONLEAVE']}\nSEMINAR. ${cnt['SEMINAR']}\nOFFSET. ${cnt['OFFSET']}\nHOLIDAY. ${cnt['HOLIDAY']}\nTOTAL..............13\nDISPATCH\n`;
 document.querySelectorAll('.mbox').forEach(m=>{
  const mob=m.querySelector('.mobile').value; const aor=m.querySelector('.aor').value;
  if(mob && aor){
   let persons=[]; m.querySelectorAll('.person').forEach(s=>{ if(s.value) persons.push(s.value); });
   if(persons.length>0){ r+=`${mob} ${aor}\n`; persons.forEach(p=>{ r+=`*${p}\n`; }); }
  }
 });
 const ro=document.getElementById('radio').value; if(ro) r+=`RADIO OPERATOR\n*${ro}\n`;
 const s1=document.getElementById('supa').value; const s2=document.getElementById('supb').value;
 if(s1||s2){ r+=`SUPERVISOR\n`; if(s1) r+=`${s1}\n`; if(s2) r+=`${s2}\n`; }
 document.getElementById('out').style.display='block'; document.getElementById('out').innerText=r; document.getElementById('copyBtn').style.display='block';
}
function copyR(){ navigator.clipboard.writeText(document.getElementById('out').innerText).then(()=>{document.getElementById('copyBtn').innerText='✅ Copied!';}); }
renderChips(); addMobile("MOBILE 01","BALINTAWAK S/B"); addMobile("MOBILE 05","MEGA MALL N/B"); refreshDispatch();
</script>
</body>
</html>
